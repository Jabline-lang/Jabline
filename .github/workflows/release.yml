name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ''
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            ext: ''
          - os: macos-latest
            goos: darwin
            goarch: amd64
            ext: ''
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ''
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: '.exe'

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Run tests
        run: go test ./... -v -count=1

      - name: Vet
        run: go vet ./...

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -o dist/jabline-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} -ldflags="-s -w -X main.Version=${{ github.ref_name }}" .

      - name: Generate checksum
        run: |
          cd dist
          sha256sum jabline-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} > jabline-${{ matrix.goos }}-${{ matrix.goarch }}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: jabline-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/jabline-${{ matrix.goos }}-${{ matrix.goarch }}*

  create-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: jabline-*
          path: dist

      - name: Generate release notes
        run: |
          echo "# Jabline ${{ github.ref_name }}" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "## Installation" >> RELEASE_NOTES.md
          echo "Download the appropriate binary for your platform, extract it, and run:" >> RELEASE_NOTES.md
          echo '```bash' >> RELEASE_NOTES.md
          echo 'chmod +x jabline' >> RELEASE_NOTES.md
          echo 'sudo mv jabline /usr/local/bin/jabline' >> RELEASE_NOTES.md
          echo '```' >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "## Changelog" >> RELEASE_NOTES.md
          git log --oneline $(git tag --sort=-version:refname | head -2 | tail -1)..${{ github.ref_name }} --no-decorate 2>/dev/null | sed 's/^/- /' >> RELEASE_NOTES.md || true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false

  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
